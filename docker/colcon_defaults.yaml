# colcon in the mapping and loc containers (COLCON_DEFAULTS_FILE in compose.yaml): build the two ament packages,
# mapping/ and localization/. Without this it would also pick up eskf/ (plain CMake, has its own build/; the
# localization package builds it with add_subdirectory) and anything else with a CMakeLists.txt.
# build/ install/ log/ go to the repo root (gitignored). Override per call: colcon build --base-paths <dir>
# The mapping image has no small_gicp: there, colcon build --packages-select brightdrive_mapping.
build:
  base-paths: [mapping, localization]
  symlink-install: true
  cmake-args: [-DCMAKE_BUILD_TYPE=RelWithDebInfo, -DCMAKE_EXPORT_COMPILE_COMMANDS=ON]
test:
  base-paths: [mapping, localization]
