; Mounted into the server as CarlaUE4/Config/UserEngine.ini (compose.yaml). Start in Town03 instead of
; Town10HD_Opt: nothing to load from the client, and the startup VRAM peak drops from ~6.0 GB to ~3.2 GB.
; (A map name on the command line is ignored by UE4 Shipping builds, which CARLA is.)
[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Carla/Maps/Town03.Town03
