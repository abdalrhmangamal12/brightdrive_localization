# brightdrive_localization settings. Core values have no defaults in the node: a missing or non-positive key stops it
# with the key's name. Every value is logged at startup. Starting values; the matcher study and the replays calibrate them.
/**:
  ros__parameters:
    use_sim_time: true

    # ---- node only ---------------------------------------------------------------------------------------------
    imu_topic: /imu/data
    gnss_topic: /gnss/fix_gated          # the gated fixes: the outage scenario withholds them here
    points_topic: /points_raw
    initialpose_topic: /initialpose
    map_yaml: /maps/town03_static.yaml   # its `map:` block: pcd, frame, georeferenced, projection, resolution_m
    odom_frame: odom
    base_frame: base_link
    publish_tf: true
    output_every_n_imu: 2                # 100 Hz IMU -> 50 Hz pose, odometry, TF
    status_rate_hz: 10.0
    debug_metrics: true                  # /localization/debug/match: one small array per sweep
    debug_clouds: false                  # /localization/debug/aligned_scan (best effort) for RViz / Foxglove
    debug_cloud_rate_hz: 5.0             # aligned_scan at most this often (data time)
    publish_map: true                    # /localization/map once (latched) for RViz / Foxglove
    publish_map_voxel_m: 2.0             # its voxel size; the matcher's maps are not affected

    # ---- extrinsics (sim/config/sensors.yaml), xyz [m], roll pitch yaw [deg] -----------------------------------
    T_base_imu_xyz: [0.0, 0.0, 0.0]
    T_base_imu_rpy_deg: [0.0, 0.0, 0.0]
    T_base_lidar_xyz: [0.0, 0.0, 1.9]
    T_base_lidar_rpy_deg: [0.0, 0.0, 0.0]
    imu_time_offset_s: 0.0               # added to IMU stamps; calibrate on the bags

    # ---- per-point time of the cloud -----------------------------------------------------------------------------
    # CARLA bridge and Velodyne: field `time` in seconds after the stamp, stamp = sweep start.
    # Ouster: `t` in ns -> time_scale 1.0e-9. Livox: `offset_time` in ns.
    points:
      time_field: time
      time_scale: 1.0                    # field unit -> seconds
      stamp_is: start                    # start | end: where the header stamp sits in the sweep

    # ---- eskf::Params ------------------------------------------------------------------------------------------
    eskf:
      noise_model: per_sample            # CARLA sigmas are per reading (sensors.yaml); density for a datasheet IMU
      sigma_a: 0.5                       # [m/s^2] per reading; 10x the CARLA value: covers the curb jolts at corners
      sigma_g: 0.05                      # [rad/s]  per reading; 10x the CARLA value, same reason
      sigma_ba: 0.0001                   # [m/s^2/sqrt(s)]
      sigma_bg: 0.00001                  # [rad/s/sqrt(s)]
      lever_arm: [0.0, 0.0, 1.8]         # GNSS antenna in IMU axes [m]
      gate: 11.34                        # chi2 3 DOF 99 %, GNSS
      gate_pose: 22.46                   # chi2 6 DOF 99.9 % while R is fixed floors; 16.81 (99 %) once calibrated
    gnss_default_sigma_m: 0.3            # when a fix carries no covariance

    # ---- scan matcher (small_gicp VGICP) -----------------------------------------------------------------------
    matcher:
      map_voxel_m: 1.0                   # fine voxel map, tracking
      coarse_voxel_m: 5.0                # coarse voxel map, initializer grid (5 m: wider basin than 2.5 m)
      source_leaf_m: 0.5
      max_corr_dist_m: 1.0               # fine
      coarse_max_corr_dist_m: 5.0        # coarse; above ~0.87 x voxel it has no effect (centre-voxel lookup)
      max_iterations: 50                 # 20 converged only 78 % of the 1 m / 5 deg starts, 50 gives 99 %
      num_threads: 4
      cov_neighbors: 10                  # per-point covariance from this many neighbours (map and source)
      min_range_m: 3.0                   # the car's own returns
      max_range_m: 100.0

    # ---- LiDAR pose measurement and acceptance ------------------------------------------------------------------
    meas:
      sigma_pos_m: 0.15                  # R floors; tune to NIS mean ~6
      sigma_rot_rad: 0.025
    accept:
      min_source_points: 1000            # after preprocess (0.5 m leaf); a CARLA sweep gives ~10 600
      min_inlier_ratio: 0.6              # gross check only: aligned sweeps sit near 1.0; watch it in dense traffic
      max_error_per_inlier: 0.12         # nominal bag: successes <= 0.087, failures >= 0.14 (dimensionless)
      max_jump_m: 3.0                    # match vs prediction, sanity bound
      max_jump_rad: 0.2
      max_age_s: 0.2                     # t_now - t_ref when the match lands

    # ---- per-sweep pipeline -------------------------------------------------------------------------------------
    scan:
      imu_wait_s: 0.02                   # wall time a sweep waits for the IMU sample at its end, else skipped

    # ---- state history -------------------------------------------------------------------------------------------
    history:
      keep_s: 3.0                        # poses + events: deskew, forwarding; init: still window (2 s) + search

    # ---- initializer -----------------------------------------------------------------------------------------------
    init:
      yaw_steps: 36                      # 10 deg grid on the coarse map, always searched in full
      refine_top: 3
      margin: 0.1                        # error per inlier: the second distinct pose must be this much worse than the best
      confirm_n: 5                       # accepted matches in a row before TRACKING
      timeout_s: 10.0                    # INITIALIZING longer than this: status WARN
      seed_gnss_max_age_s: 1.0           # position seed = a fix at most this old with horizontal sigma <= max_seed_gnss_sigma_m;
      max_seed_gnss_sigma_m: 2.0         #   else /initialpose if the car has been still since its stamp; else wait
      vel_window_s: 1.0                  # GNSS velocity at init: least squares over the fixes of the last vel_window_s
      vel_min_fixes: 5
      vel_min_span_s: 0.5                # first to last fix
      vel_sigma_floor_mps: 0.2           # its sigma = fix sigma / sqrt(sum (t - t_mean)^2), at least this
      still_window_s: 2.0                # still test window before the sweep; b_g = gyro mean when still
      still_max_gyro_radps: 0.05         # every sample (CARLA: noise 0.005, bias <= 0.002)
      still_max_acc_std_mps2: 0.2        # spread of |acc| (noise 0.05)
      still_max_acc_mean_dev_mps2: 0.1   # |mean |acc| - |g||
      still_max_gnss_speed_mps: 0.3      # GNSS speed bound = max(this, still_gnss_speed_sigmas x sigma of the GNSS velocity):
      still_gnss_speed_sigmas: 3.0       #   a standing car's 1 s fit reads 0.55 m/s median, 0.91 max (sigma 0.33)
      cog_min_speed_mps: 3.0             # above: the yaw hint is the GNSS course over ground; else /initialpose yaw; else none
      cog_check_min_speed_mps: 5.0       # above: a winner further than cog_max_diff_deg from the course is rejected
      cog_max_diff_deg: 20.0
      carry_bg_max_radps: 0.1            # a discarded filter's b_g seeds the next start only below this on every axis
      p0_sigma_pos_m: 0.3
      p0_sigma_yaw_deg: 5.0
      p0_sigma_rollpitch_deg: 2.0
      p0_sigma_vel_mps: 0.5              # still: v0 = 0
      p0_sigma_vel_moving_mps: 10.0      # moving without a GNSS velocity: v0 = 0 (with it: v0 and sigma from the fit)
      p0_sigma_ba: 0.1
      p0_sigma_bg: 0.005

    # ---- health ----------------------------------------------------------------------------------------------------
    health:
      scan_timeout_s: 0.5
      gnss_timeout_s: 1.0
      dr_timeout_s: 1.0
      degraded_sigma_m: 0.5
      fail_consecutive_gated: 10         # 0.5 s of NIS-gated sweeps
      fail_timeout_s: 5.0
      fail_sigma_m: 3.0
